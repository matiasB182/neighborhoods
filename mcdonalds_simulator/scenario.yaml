# ═══════════════════════════════════════════════════════════════════════════════
# SIMULADOR DE ESCENARIOS McDONALD'S — Archivo de configuración
# ═══════════════════════════════════════════════════════════════════════════════
# Uso: python run.py --scenario scenario.yaml
# GENIA completa este archivo según la pregunta del usuario y lo ejecuta.
# ═══════════════════════════════════════════════════════════════════════════════

escenario:
  nombre: "Nombre descriptivo del escenario"

filtros:
  clasificacion_2: null    # texto libre, se resuelve por similitud. null = todas
  sucursal: null           # api_id_integer. null = todas las sucursales
  periodo_desde: "2025-04" # formato YYYY-MM
  periodo_hasta: "2025-06"

palancas:

  # ── PRECIO ──────────────────────────────────────────────────────────────────
  - tipo: precio
    activo: false
    cambio_pct: 0.10             # positivo = sube | negativo = baja

  # ── PROMOCIÓN: descuento ────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: descuento
    clasificacion_2: "combo big mac"
    cambio_pct: -0.30            # -0.30 = 30% OFF
    canal: null                  # automac | delivery | app | restaurante | null = todos

  # ── PROMOCIÓN: 2x1 ──────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: 2x1
    clasificacion_2: "mcflurry oreo"
    canal: null                  # automac | delivery | app | restaurante | null = todos

  # ── PROMOCIÓN: precio fijo ───────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: precio_fijo
    clasificacion_2: "triple con queso"
    precio: 15000                # precio absoluto en Gs.
    canal: null                  # automac | delivery | app | restaurante | null = todos

  # ── PROMOCIÓN: producto gratis ───────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: producto_gratis
    clasificacion_2: "combo cuarto de libra"
    producto_gratis: "nuggets"   # descriptivo, aparece en el output
    canal: null                  # automac | delivery | app | restaurante | null = todos

  # ── LANZAMIENTO ─────────────────────────────────────────────────────────────
  - tipo: lanzamiento
    activo: false
    clasificacion_2: "mcflurry"
    nombre_referencia: "McFlurry Brownie nuevo"
    proxy_lanzamiento: null      # nombre de lanzamiento histórico similar | null = auto

  # ── ESTRUCTURAL ─────────────────────────────────────────────────────────────
  - tipo: estructural
    activo: false
    canal: automac               # automac | delivery | app | restaurante | centro_postres
    sucursal: null               # api_id_integer | null = todas

  # ── COMPETENCIA ─────────────────────────────────────────────────────────────
  - tipo: competencia
    activo: false
    sucursal: 1234               # api_id_integer afectado
    distancia_km: 0.5            # distancia del competidor en km

  # ── CLIMA ────────────────────────────────────────────────────────────────────
  - tipo: clima
    activo: false
    variacion_pct: -0.20         # negativo = más frío/lluvioso | positivo = más caluroso
