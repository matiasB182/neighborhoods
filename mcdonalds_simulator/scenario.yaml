# ═══════════════════════════════════════════════════════════════════════════════
# SIMULADOR DE ESCENARIOS McDONALD'S PARAGUAY
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cómo usar este archivo:
#   1. Escribir un nombre descriptivo para el escenario
#   2. Buscar la palanca que corresponde a la simulación deseada (1 a 7)
#   3. Cambiar "activo: false" a "activo: true" en esa palanca
#   4. Completar los parámetros (ver instrucciones en cada sección)
#   5. Ejecutar: python run.py --scenario scenario.yaml
#
# IMPORTANTE: Solo una palanca puede estar activa a la vez.
#
# CÓMO FUNCIONA EL SISTEMA:
#   - Toma el forecast de ventas del período indicado como punto de partida.
#   - Cada palanca aplica un efecto sobre ese forecast según su lógica.
#   - El resultado muestra: unidades base, unidades simuladas y el delta %.
#   - Los efectos se calculan desde datos históricos reales cuando están
#     disponibles, o con supuestos documentados cuando no los hay.
#
# ═══════════════════════════════════════════════════════════════════════════════

escenario:
  nombre: "Nombre descriptivo del escenario"  # aparece en el output y en el CSV


palancas:

  # ════════════════════════════════════════════════════════════════════════════
  # 1) PRECIO — SIMULAR CAMBIO
  #
  # ¿Qué pasa si subo o bajo el precio de una categoría en un % fijo?
  #
  # FÓRMULA:
  #   elasticidad      = Δ% unidades / Δ% precio  (calculada de datos históricos)
  #   impacto_volumen  = cambio_pct × elasticidad
  #   unidades_sim     = forecast × (1 + impacto_volumen)
  #   ingreso_sim      = unidades_sim × (precio_actual × (1 + cambio_pct))
  #
  # EJEMPLO PRÁCTICO:
  #   forecast Combo Big Mac mayo = 10.000 unidades
  #   elasticidad histórica       = -0.8
  #   cambio_pct                  = +0.10  (sube 10% el precio)
  #   → impacto_volumen = 0.10 × -0.8 = -0.08  (caen 8% las unidades)
  #   → unidades_sim    = 10.000 × (1 - 0.08) = 9.200 unidades
  #   → si precio base era Gs. 35.000, ingreso pasa de Gs. 350M a Gs. 354M
  #
  # Parámetros:
  #   clasificacion_2 → texto libre, el sistema busca la categoría más parecida
  #   sucursal        → número de sucursal, o null para todas
  #   periodo_desde   → mes de inicio (YYYY-MM)
  #   periodo_hasta   → mes de fin    (YYYY-MM)
  #   cambio_pct      → positivo = sube precio | negativo = baja precio
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: simular
    clasificacion_2: "combo big mac"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    cambio_pct: 0.10


  # ════════════════════════════════════════════════════════════════════════════
  # 2) PRECIO — OPTIMIZAR
  #
  # ¿Cuál es el precio óptimo para maximizar ingresos, volumen o llegar al
  # punto de equilibrio?
  #
  # FÓRMULA:
  #   Para cada cambio_pct en pasos de 1% dentro del rango definido:
  #     unidades_sim = forecast × (1 + cambio_pct × elasticidad)
  #     ingreso_sim  = unidades_sim × (precio_actual × (1 + cambio_pct))
  #   Se elige el cambio_pct que mejor cumple el objetivo.
  #
  # EJEMPLO PRÁCTICO:
  #   objetivo: max_ingreso | rango: -30% a +30%
  #   El sistema prueba -30%, -29%, ..., 0%, +1%, ..., +30%
  #   y devuelve el precio que genera el mayor ingreso total.
  #
  #   Resultado típico: con elasticidad -0.8, el óptimo suele estar en +10% a +15%
  #   (sube el precio lo suficiente para compensar la caída de volumen)
  #
  # Parámetros:
  #   objetivo    → max_ingreso  = ¿a qué precio se maximiza el ingreso?
  #                 max_unidades = ¿a qué precio se venden más unidades?
  #                 breakeven    = ¿hasta cuánto puedo subir sin perder ingreso?
  #   rango_desde → límite inferior a explorar (ej: -0.30 = -30%)
  #   rango_hasta → límite superior a explorar (ej: +0.30 = +30%)
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: optimizar
    clasificacion_2: "combo big mac"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    objetivo: max_ingreso
    rango_desde: -0.30
    rango_hasta: 0.30


  # ════════════════════════════════════════════════════════════════════════════
  # 3) PROMOCIÓN
  #
  # ¿Qué impacto tendría una promoción puntual sobre una categoría?
  # Subpalancas disponibles:
  #   3.1) descuento       → % de descuento sobre el precio
  #   3.2) 2x1             → llevás 2 pagás 1 (50% OFF efectivo)
  #   3.3) precio_fijo     → precio especial en guaraníes
  #   3.4) producto_gratis → regalo al comprar otro producto
  #
  # BASE COMÚN A TODAS LAS PROMOS:
  #   Las promos duran días, no meses. El forecast se escala a los días exactos:
  #   forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #
  # EJEMPLO:
  #   forecast Combo Big Mac junio = 10.000 unidades (30 días)
  #   promo dura 3 días (15 al 17 de junio)
  #   → forecast_promo = 10.000 / 30 × 3 = 1.000 unidades base de la promo
  #
  # Parámetros comunes:
  #   clasificacion_2 → texto libre, el sistema busca la categoría más parecida
  #   sucursal        → número de sucursal, o null para todas
  #   fecha_desde     → inicio de la promo (YYYY-MM-DD)
  #   fecha_hasta     → fin de la promo    (YYYY-MM-DD) — mismo día = promo de 1 día
  #   canal           → automac | delivery | app | restaurante | null = todos
  # ════════════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────────
  # 3.1) PROMOCIÓN — DESCUENTO
  #
  # ¿Qué impacto tendría ofrecer un % de descuento sobre el precio normal?
  #
  # FÓRMULA:
  #   impacto_volumen  = cambio_pct × elasticidad_histórica
  #   unidades_sim     = forecast_promo × (1 + impacto_volumen)
  #   ingreso_sim      = unidades_sim × (precio_actual × (1 + cambio_pct))
  #
  # EJEMPLO PRÁCTICO:
  #   forecast_promo Combo Big Mac (3 días) = 1.000 unidades
  #   elasticidad histórica                 = -0.8
  #   cambio_pct                            = -0.30  (30% de descuento)
  #   → impacto_volumen = -0.30 × -0.8 = +0.24  (suben 24% las unidades)
  #   → unidades_sim    = 1.000 × 1.24 = 1.240 unidades en los 3 días
  #
  # Ejemplos de uso:
  #   "McDelivery Week: 30% OFF Combo Big Mac por Delivery"
  #   "Automac Days: 25% OFF Combo Cuarto de Libra"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: descuento
    clasificacion_2: "combo big mac"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-17"
    cambio_pct: -0.30              # -0.30 = 30% de descuento
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.2) PROMOCIÓN — 2x1
  #
  # ¿Qué impacto tendría un 2x1 en una categoría?
  #
  # FÓRMULA:
  #   forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #   uplift         = medido sobre campañas 2x1 históricas similares (mismo tipo de producto):
  #                    (ventas_reales_promo - forecast_ese_período) / forecast_ese_período
  #                    promediado sobre todas las campañas 2x1 comparables con fechas disponibles
  #   unidades_sim   = forecast_promo × (1 + uplift)
  #
  #   Si no hay fechas cargadas en la tabla de promos históricas:
  #   → uplift = +40% supuesto conservador  (se indica en el output como "supuesto")
  #
  # EJEMPLO PRÁCTICO:
  #   forecast_promo McFlurry Oreo (1 día viernes) = 200 unidades
  #   uplift promedio de campañas 2x1 McFlurry históricas = +45%
  #   → unidades_sim = 200 × 1.45 = 290 unidades ese viernes
  #
  #   Sin fechas históricas (supuesto):
  #   → uplift = +40% → unidades_sim = 200 × 1.40 = 280 unidades
  #
  # Ejemplos de uso:
  #   "2x1 McFlurry Oreo todos los viernes por Automac"
  #   "Día de la hamburguesa: 2x1 McCombo Cuarto de Libra"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: 2x1
    clasificacion_2: "mcflurry oreo"
    sucursal: null
    fecha_desde: "2025-06-20"
    fecha_hasta: "2025-06-20"
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.3) PROMOCIÓN — PRECIO FIJO
  #
  # ¿Qué impacto tendría ofrecer un precio especial en guaraníes?
  #
  # FÓRMULA:
  #   cambio_pct       = (precio_fijo - precio_promedio_histórico) / precio_promedio_histórico
  #   impacto_volumen  = cambio_pct × elasticidad_histórica
  #   unidades_sim     = forecast_promo × (1 + impacto_volumen)
  #   ingreso_sim      = unidades_sim × precio_fijo
  #
  # EJEMPLO PRÁCTICO:
  #   precio promedio histórico Triple con Queso = Gs. 22.000
  #   precio fijo promocional                    = Gs. 15.000
  #   → cambio_pct      = (15.000 - 22.000) / 22.000 = -0.318  (-31.8%)
  #   → impacto_volumen = -0.318 × -0.8 = +0.254  (suben 25% las unidades)
  #   → forecast_promo (3 días) = 900 unidades
  #   → unidades_sim = 900 × 1.254 = 1.129 unidades
  #
  # Ejemplos de uso:
  #   "Triple con Queso a Gs. 15.000 en restaurantes y Automac"
  #   "Combo Cuarto de Libra a Gs. 20.000 por la App"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: precio_fijo
    clasificacion_2: "triple con queso"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-17"
    precio: 15000                  # precio promocional en guaraníes
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.4) PROMOCIÓN — PRODUCTO GRATIS
  #
  # ¿Qué impacto tendría regalar un producto al comprar otro?
  # (No hay cambio de precio → el efecto es uplift de demanda pura)
  #
  # FÓRMULA:
  #   uplift       = medido sobre promos históricas similares con fechas cargadas:
  #                  (ventas_reales_promo - forecast_ese_período) / forecast_ese_período
  #                  promediado sobre todas las promos comparables
  #   unidades_sim = forecast_promo × (1 + uplift)
  #
  #   Si no hay fechas cargadas en la tabla de promos históricas:
  #   → uplift = +10% supuesto conservador  (se indica en el output como "supuesto")
  #   Para habilitar el cálculo real: agregar col D (fecha_desde) y col E (fecha_hasta)
  #   en la hoja "Códigos-Promo" del Excel y volver a correr el ETL.
  #
  # EJEMPLO PRÁCTICO:
  #   forecast_promo Combo Cuarto de Libra (2 días) = 600 unidades
  #   uplift histórico promos producto_gratis similares = +12%
  #   → unidades_sim = 600 × 1.12 = 672 unidades
  #
  # Ejemplos de uso:
  #   "McNuggets gratis comprando un McCombo Cuarto de Libra"
  #   "Comprando 1 McCombo por PeYa te llevás 4 McNuggets de regalo"
  #   "Día de la Papa Frita: 1 McPapas mediana gratis por la App"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: producto_gratis
    clasificacion_2: "combo cuarto de libra"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-16"
    producto_gratis: "nuggets"     # nombre del regalo (solo descriptivo)
    canal: null


  # ════════════════════════════════════════════════════════════════════════════
  # 4) LANZAMIENTO
  #
  # ¿Qué impacto tendría lanzar un producto nuevo en una categoría?
  #
  # FÓRMULA:
  #   Para cada lanzamiento histórico de referencia:
  #     baseline     = promedio de ventas mensuales de la categoría
  #     uplift_mes_n = (ventas_mes_n - baseline) / baseline
  #   Se promedian los uplift por mes relativo entre todos los lanzamientos.
  #   unidades_sim[mes] = forecast[mes] × (1 + uplift[mes_relativo])
  #
  # EJEMPLO PRÁCTICO:
  #   Lanzamiento nuevo McFlurry, categoría tiene 3 lanzamientos históricos.
  #   Patrón promedio calculado:
  #     mes 0 (lanzamiento): +18%  → forecast 5.000 × 1.18 = 5.900 unidades
  #     mes 1:               +12%  → forecast 5.000 × 1.12 = 5.600 unidades
  #     mes 2:               +7%   → forecast 5.000 × 1.07 = 5.350 unidades
  #     mes 3 en adelante:   vuelve al nivel base del forecast
  #
  #   Si no hay lanzamientos históricos de la categoría → usa patrón default:
  #   mes 0: +18% | mes 1: +12% | mes 2: +7% | mes 3: +4% | mes 4: +2% | mes 5: +1%
  #
  # Parámetros:
  #   clasificacion_2    → categoría donde se lanza el producto (texto libre)
  #   sucursal           → número de sucursal, o null para todas
  #   periodo_desde      → mes del lanzamiento (YYYY-MM)
  #   periodo_hasta      → dejar al menos 6 meses para ver el patrón completo
  #   nombre_referencia  → nombre descriptivo del producto nuevo (solo para el output)
  #   proxy_lanzamiento  → nombre de un lanzamiento histórico similar como referencia
  #                        null = el sistema elige automáticamente
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: lanzamiento
    activo: false
    clasificacion_2: "mcflurry"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-09"
    nombre_referencia: "McFlurry Brownie nuevo"
    proxy_lanzamiento: "McFlurry Braunitos Tatakua"


  # ════════════════════════════════════════════════════════════════════════════
  # 5) ESTRUCTURAL
  #
  # ¿Qué impacto tendría agregar un canal de venta a una o varias sucursales?
  #
  # FÓRMULA:
  #   avg_con_canal = promedio de ventas históricas de sucursales CON el canal
  #   avg_sin_canal = promedio de ventas históricas de sucursales SIN el canal
  #   efecto        = (avg_con_canal - avg_sin_canal) / avg_sin_canal
  #   unidades_sim  = forecast × (1 + efecto)
  #
  # EJEMPLO PRÁCTICO:
  #   Sucursales con Automac venden en promedio 12.000 unidades/mes de combos.
  #   Sucursales sin Automac venden en promedio 9.000 unidades/mes de combos.
  #   → efecto     = (12.000 - 9.000) / 9.000 = +33%
  #   → forecast sucursal sin Automac = 8.500 unidades
  #   → unidades_sim = 8.500 × 1.33 = 11.305 unidades si se agrega Automac
  #
  #   Nota: comparación observacional, no experimental. Sucursales con Automac
  #   pueden tener más ventas también por su ubicación. Usar zona para reducir
  #   ese sesgo comparando sucursales más similares entre sí.
  #
  # Parámetros:
  #   canal     → automac | delivery | app | restaurante | centro_postres
  #   sucursal  → número de sucursal, o null para todas
  #   zona      → barrio | distrito | dpto | null = todo el país
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: estructural
    activo: false
    clasificacion_2: null
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    canal: automac
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 6) COMPETENCIA
  #
  # ¿Qué impacto tendría que un competidor abra cerca de una sucursal?
  #
  # FÓRMULA:
  #   similares    = sucursales que ya tienen un competidor a distancia_km ± 0.3km
  #   avg_con_comp = promedio de ventas históricas de esas sucursales
  #   avg_sin_comp = promedio de ventas históricas de sucursales sin competidor cercano
  #   efecto       = (avg_con_comp - avg_sin_comp) / avg_sin_comp  [siempre ≤ 0]
  #   unidades_sim[sucursal_afectada] = forecast × (1 + efecto)
  #   unidades_sim[resto]             = forecast  (sin cambio)
  #
  # EJEMPLO PRÁCTICO:
  #   Sucursal 1234, competidor abre a 500m.
  #   Sucursales con competidor a 300-800m → venden en prom. 9.200 unidades/mes.
  #   Sucursales sin competidor cercano   → venden en prom. 10.000 unidades/mes.
  #   → efecto     = (9.200 - 10.000) / 10.000 = -8%
  #   → forecast sucursal 1234 = 11.500 unidades
  #   → unidades_sim = 11.500 × 0.92 = 10.580 unidades
  #
  #   Si no hay sucursales comparables, usa supuestos por banda de distancia:
  #     < 300m → -15%  |  300-600m → -10%  |  600m-1km → -6%
  #     1-2km  → -3%   |  > 2km    → -1%
  #
  # Parámetros:
  #   sucursal     → número de la sucursal afectada (obligatorio)
  #   distancia_km → distancia estimada del competidor en kilómetros
  #   zona         → barrio | distrito | dpto | null = todo el país
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: competencia
    activo: false
    clasificacion_2: null
    sucursal: 1234
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    distancia_km: 0.5
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 7) CLIMA
  #
  # ¿Qué impacto tendría un clima inusualmente frío, caluroso o lluvioso?
  #
  # FÓRMULA:
  #   efecto       = variacion_pct × coeficiente_clima[categoría]
  #   unidades_sim = forecast × (1 + efecto)
  #
  # EJEMPLO PRÁCTICO:
  #   Escenario: junio 20% más frío que el promedio histórico → variacion_pct = -0.20
  #
  #   McFlurry (coef. -0.40 → muy sensible al frío, cae):
  #   → efecto = -0.20 × -0.40 = -0.08  → McFlurry cae 8%
  #   → forecast 3.000 unidades → unidades_sim = 3.000 × 0.92 = 2.760 unidades
  #
  #   McCafé (coef. +0.20 → sube con el frío):
  #   → efecto = -0.20 × +0.20 = +0.04  → McCafé sube 4%
  #   → forecast 1.000 unidades → unidades_sim = 1.000 × 1.04 = 1.040 unidades
  #
  #   Combos (coef. -0.05 → poco sensibles):
  #   → efecto = -0.20 × -0.05 = -0.01  → caen apenas 1%
  #
  # RESUMEN DE IMPACTOS:
  #   variacion_pct < 0 (más frío/lluvioso): helados/postres bajan | café sube | combos casi igual
  #   variacion_pct > 0 (más caluroso):      helados/postres suben | café baja | combos casi igual
  #
  #   Nota: los coeficientes son supuestos de industria, no calculados sobre
  #   datos de McDonald's Paraguay. Usarlo como referencia indicativa.
  #
  # Parámetros:
  #   variacion_pct → negativo = más frío/lluvioso | positivo = más caluroso
  #   sucursal      → número de sucursal, o null para todas
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: clima
    activo: false
    clasificacion_2: null
    sucursal: null
    periodo_desde: "2025-06"
    periodo_hasta: "2025-08"
    variacion_pct: -0.20
