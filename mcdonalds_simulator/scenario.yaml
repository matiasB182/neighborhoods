# ═══════════════════════════════════════════════════════════════════════════════
# SIMULADOR DE ESCENARIOS McDONALD'S
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cómo usar este archivo:
#   1. Ponerle un nombre al escenario
#   2. Buscar la palanca que corresponde a la simulación deseada
#   3. Cambiar "activo: false" a "activo: true" en esa palanca
#   4. Completar los parámetros (ver ejemplos y comentarios en cada palanca)
#   5. Ejecutar: python run.py --scenario scenario.yaml
#
# IMPORTANTE: Solo una palanca puede estar activa a la vez.
#
# CÓMO FUNCIONA EL SISTEMA:
#   - El sistema carga el forecast de ventas del período indicado como punto de partida.
#   - Cada palanca aplica un efecto sobre ese forecast según su lógica específica.
#   - El resultado muestra: unidades base, unidades simuladas, y el delta.
#   - Todos los efectos se calculan a partir de datos históricos reales cuando
#     están disponibles, o con supuestos documentados cuando no los hay.
#
# ═══════════════════════════════════════════════════════════════════════════════

escenario:
  nombre: "Nombre descriptivo del escenario"  # aparece en el output y en el CSV


palancas:

  # ════════════════════════════════════════════════════════════════════════════
  # PRECIO
  # ¿Qué pasa si subo o bajo el precio de una categoría?
  #
  # CÓMO SE CALCULA:
  #   1. El sistema busca la elasticidad histórica de la categoría:
  #      elasticidad = promedio de (Δ% unidades / Δ% precio) por cada cambio
  #      de precio registrado en los datos históricos.
  #      Ej: elasticidad -0.8 significa que si el precio sube 10%, las ventas caen 8%.
  #   2. impacto_volumen = cambio_pct × elasticidad
  #   3. unidades_simuladas = forecast × (1 + impacto_volumen)
  #   4. ingreso_simulado = unidades_simuladas × precio_nuevo
  #
  # Ejemplos:
  #   "¿Qué pasa si subo un 10% el Combo Big Mac?"  → cambio_pct: 0.10
  #   "¿Qué pasa si bajo un 15% el McFlurry?"       → cambio_pct: -0.15
  # ════════════════════════════════════════════════════════════════════════════
  # Modo simular: aplica un cambio de precio fijo
  - tipo: precio
    activo: false
    modo: simular                     # simular = cambio fijo | optimizar = busca el óptimo
    clasificacion_2: "combo big mac"  # texto libre, el sistema busca la más parecida
    sucursal: null                    # número de sucursal | null = todas
    periodo_desde: "2025-04"          # mes de inicio (YYYY-MM)
    periodo_hasta: "2025-06"          # mes de fin    (YYYY-MM)
    cambio_pct: 0.10                  # positivo = sube | negativo = baja

  # Modo optimizar: encuentra el cambio de precio óptimo dentro de un rango
  #
  # CÓMO SE CALCULA:
  #   Evalúa cada cambio de precio en pasos de 1% dentro del rango definido
  #   y elige el que maximiza el objetivo indicado.
  #
  # Objetivos disponibles:
  #   max_ingreso  → ¿a qué precio se maximiza el ingreso total?
  #                  (puede ser subiendo el precio aunque se vendan menos unidades)
  #   max_unidades → ¿a qué precio se venden más unidades?
  #                  (casi siempre implica bajar el precio)
  #   breakeven    → ¿hasta cuánto puedo subir sin perder ingreso?
  #                  (el punto donde la ganancia por precio compensa la caída en volumen)
  - tipo: precio
    activo: false
    modo: optimizar
    clasificacion_2: "combo big mac"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    objetivo: max_ingreso             # max_ingreso | max_unidades | breakeven
    rango_desde: -0.30                # explorar desde -30%
    rango_hasta: 0.30                 # hasta +30%


  # ════════════════════════════════════════════════════════════════════════════
  # PROMOCIÓN: DESCUENTO
  # ¿Qué pasa si hago un % de descuento sobre una categoría?
  #
  # CÓMO SE CALCULA:
  #   1. forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #      (el forecast se escala a los días exactos que dura la promo)
  #   2. Usa la elasticidad histórica de la categoría (igual que palanca precio)
  #   3. impacto_volumen = cambio_pct × elasticidad
  #   4. unidades_simuladas = forecast_promo × (1 + impacto_volumen)
  #   5. ingreso_simulado = unidades_simuladas × precio_con_descuento
  #
  # Ejemplos:
  #   "McDelivery Week: 30% OFF Combo Big Mac por Delivery"
  #   "Automac Days: 25% OFF Combo Cuarto de Libra"
  #   "15% OFF Combo Big Mac todo el mes"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: promocion
    activo: false
    subtipo: descuento
    clasificacion_2: "combo big mac"  # texto libre, el sistema busca la más parecida
    sucursal: null                    # número de sucursal | null = todas
    fecha_desde: "2025-06-15"         # inicio de la promo (YYYY-MM-DD)
    fecha_hasta: "2025-06-15"         # fin de la promo (YYYY-MM-DD) — mismo día = promo de 1 día
    cambio_pct: -0.30                 # -0.30 = 30% de descuento
    canal: null                       # automac | delivery | app | restaurante | null = todas


  # ════════════════════════════════════════════════════════════════════════════
  # PROMOCIÓN: 2x1
  # ¿Qué pasa si hago un 2x1 en una categoría?
  #
  # CÓMO SE CALCULA:
  #   Igual que descuento, pero el cambio_pct es automáticamente -50%
  #   (un 2x1 equivale a pagar 1 y llevarse 2, es decir 50% OFF en precio efectivo).
  #   1. forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #   2. impacto_volumen = -0.50 × elasticidad
  #   3. unidades_simuladas = forecast_promo × (1 + impacto_volumen)
  #
  # Ejemplos:
  #   "2x1 McFlurry Oreo todos los viernes por Automac"
  #   "Día de la hamburguesa: 2x1 McCombo Cuarto de Libra"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: promocion
    activo: false
    subtipo: 2x1
    clasificacion_2: "mcflurry oreo"  # texto libre, el sistema busca la más parecida
    sucursal: null                    # número de sucursal | null = todas
    fecha_desde: "2025-06-15"         # inicio de la promo (YYYY-MM-DD)
    fecha_hasta: "2025-06-15"         # fin de la promo (YYYY-MM-DD)
    canal: null                       # automac | delivery | app | restaurante | null = todas


  # ════════════════════════════════════════════════════════════════════════════
  # PROMOCIÓN: PRECIO FIJO
  # ¿Qué pasa si pongo un precio especial en guaraníes?
  #
  # CÓMO SE CALCULA:
  #   1. El sistema busca el precio promedio histórico de la categoría
  #   2. cambio_pct = (precio_fijo - precio_promedio) / precio_promedio
  #   3. A partir de ahí, igual que descuento: aplica elasticidad sobre forecast_promo
  #
  # Ejemplos:
  #   "Triple con Queso a Gs. 15.000 en restaurantes y Automac"
  #   "Combo Cuarto de Libra a Gs. 20.000"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: promocion
    activo: false
    subtipo: precio_fijo
    clasificacion_2: "triple con queso"  # texto libre, el sistema busca la más parecida
    sucursal: null                       # número de sucursal | null = todas
    fecha_desde: "2025-06-15"            # inicio de la promo (YYYY-MM-DD)
    fecha_hasta: "2025-06-15"            # fin de la promo (YYYY-MM-DD)
    precio: 15000                        # precio promocional en guaraníes
    canal: null                          # automac | delivery | app | restaurante | null = todas


  # ════════════════════════════════════════════════════════════════════════════
  # PROMOCIÓN: PRODUCTO GRATIS
  # ¿Qué pasa si regalo un producto al comprar otro?
  #
  # CÓMO SE CALCULA:
  #   1. forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #   2. uplift = efecto estimado en unidades (sin cambio de precio)
  #
  #   Si hay fechas cargadas en la tabla de promos históricas:
  #     uplift = (ventas_reales_promo - forecast_ese_período) / forecast_ese_período
  #     promediado sobre todas las promos similares con fechas disponibles
  #
  #   Si NO hay fechas (situación actual):
  #     uplift = +10% supuesto conservador
  #     Para cargar fechas: agregar col D (fecha_desde) y E (fecha_hasta)
  #     en la hoja "Códigos-Promo" del Excel y re-correr el ETL.
  #
  #   3. unidades_simuladas = forecast_promo × (1 + uplift)
  #
  # Ejemplos:
  #   "McNuggets gratis comprando un McCombo Cuarto de Libra"
  #   "Comprando 1 McCombo por PeYa te llevás 4 McNuggets de regalo"
  #   "Día de la Papa Frita: 1 McPapas mediana gratis por la App"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: promocion
    activo: false
    subtipo: producto_gratis
    clasificacion_2: "combo cuarto de libra"  # categoría del producto principal
    sucursal: null                            # número de sucursal | null = todas
    fecha_desde: "2025-06-15"                 # inicio de la promo (YYYY-MM-DD)
    fecha_hasta: "2025-06-15"                 # fin de la promo (YYYY-MM-DD)
    producto_gratis: "nuggets"                # nombre del regalo (solo descriptivo)
    canal: null                               # automac | delivery | app | restaurante | null = todas


  # ════════════════════════════════════════════════════════════════════════════
  # LANZAMIENTO
  # ¿Qué impacto tendría lanzar un producto nuevo en una categoría?
  #
  # CÓMO SE CALCULA:
  #   1. Busca lanzamientos históricos de la misma categoría (o el proxy indicado)
  #   2. Para cada lanzamiento histórico calcula el uplift mes a mes:
  #      uplift_mes_n = (ventas_mes_n - promedio_histórico) / promedio_histórico
  #   3. Promedia el patrón entre todos los lanzamientos de referencia
  #   4. unidades_simuladas[mes] = forecast[mes] × (1 + uplift[mes_relativo])
  #      donde mes_relativo 0 = mes del lanzamiento, 1 = siguiente, etc.
  #
  #   Si no hay lanzamientos de la misma categoría, usa el patrón promedio
  #   del mismo tipo de producto (postres, combos, etc.) o el default conservador.
  #
  # Ejemplos:
  #   "¿Qué impacto tendría lanzar un McFlurry nuevo?"
  #   "¿Cómo afectaría agregar un nuevo Combo?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: lanzamiento
    activo: false
    clasificacion_2: "mcflurry"                      # categoría donde se lanza
    sucursal: null                                   # número de sucursal | null = todas
    periodo_desde: "2025-04"                         # mes del lanzamiento
    periodo_hasta: "2025-09"                         # dejar al menos 6 meses para ver el patrón
    nombre_referencia: "McFlurry Brownie nuevo"      # nombre descriptivo (solo para el output)
    proxy_lanzamiento: "McFlurry Braunitos Tatakua"  # lanzamiento histórico similar como referencia
                                                     # null = el sistema elige automáticamente


  # ════════════════════════════════════════════════════════════════════════════
  # ESTRUCTURAL
  # ¿Qué impacto tendría agregar un canal a una o todas las sucursales?
  #
  # CÓMO SE CALCULA:
  #   1. Identifica sucursales que YA tienen el canal (grupo con canal)
  #   2. Identifica sucursales SIN el canal (grupo sin canal)
  #   3. Si se especifica zona, restringe a sucursales del mismo barrio/distrito/dpto
  #      para comparar sucursales más similares entre sí
  #   4. efecto = (ventas_promedio_con_canal - ventas_promedio_sin_canal)
  #               / ventas_promedio_sin_canal
  #   5. unidades_simuladas = forecast × (1 + efecto)
  #
  #   Nota: es una comparación observacional, no experimental. Sucursales con
  #   Automac pueden tener más ventas también por su ubicación u otros factores.
  #   La zona ayuda a reducir ese sesgo.
  #
  # Ejemplos:
  #   "¿Cuánto aumentarían las ventas si la sucursal 1234 tuviera Automac?"
  #   "¿Qué impacto tendría habilitar Delivery en todas las sucursales?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: estructural
    activo: false
    clasificacion_2: null                # null = aplica sobre todas las categorías
    sucursal: null                       # número de sucursal | null = todas
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    canal: automac                       # automac | delivery | app | restaurante | centro_postres
    zona: null                           # barrio | distrito | dpto | null = todo el país


  # ════════════════════════════════════════════════════════════════════════════
  # COMPETENCIA
  # ¿Qué impacto tendría que un competidor abra cerca de una sucursal?
  #
  # CÓMO SE CALCULA:
  #   1. Busca sucursales que ya tienen competidores a distancia similar (±0.3km)
  #   2. Si se especifica zona, restringe a sucursales del mismo barrio/distrito/dpto
  #   3. efecto = (ventas_con_competidor - ventas_sin_competidor)
  #               / ventas_sin_competidor  [siempre negativo]
  #   4. unidades_simuladas[sucursal_afectada] = forecast × (1 + efecto)
  #
  #   Si no hay sucursales comparables, usa supuestos por banda de distancia:
  #     < 300m → -15%  |  300-600m → -10%  |  600m-1km → -6%
  #     1-2km  → -3%   |  > 2km    → -1%
  #
  # Ejemplos:
  #   "¿Qué pasaría si Burger King abre a 500m de la sucursal 1234?"
  #   "¿Cuánto afectaría un competidor a 1km de distancia?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: competencia
    activo: false
    clasificacion_2: null        # null = aplica sobre todas las categorías
    sucursal: 1234               # número de la sucursal afectada
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    distancia_km: 0.5            # distancia estimada del competidor en kilómetros
    zona: null                   # barrio | distrito | dpto | null = todo el país


  # ════════════════════════════════════════════════════════════════════════════
  # CLIMA
  # ¿Qué impacto tendría un clima inusual sobre las ventas?
  #
  # CÓMO SE CALCULA:
  #   1. Cada categoría tiene un coeficiente de sensibilidad climática:
  #      postres/helados: muy sensibles al frío (-0.8 a -1.2)
  #      combos/hamburguesas: poco sensibles (±0.1)
  #      café/bebidas calientes: positivos con frío (+0.3)
  #   2. efecto = variacion_pct × coeficiente_clima[clasificacion_2]
  #   3. unidades_simuladas = forecast × (1 + efecto)
  #
  #   variacion_pct es el desvío respecto al clima promedio histórico del período.
  #   Ej: -0.20 = ese mes fue 20% más frío/lluvioso que el promedio histórico.
  #
  #   Nota: los coeficientes son supuestos de industria, no calculados sobre
  #   datos históricos de McDonald's Paraguay. Tomarlo como referencia indicativa.
  #
  # Ejemplos:
  #   "¿Qué pasaría si junio es 20% más frío que el promedio histórico?"
  #   "¿Cómo afecta un verano más caluroso a las ventas de McFlurry?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: clima
    activo: false
    clasificacion_2: null        # null = aplica sobre todas las categorías
    sucursal: null               # número de sucursal | null = todas
    periodo_desde: "2025-06"
    periodo_hasta: "2025-08"
    variacion_pct: -0.20         # negativo = más frío/lluvioso que el promedio
                                 # positivo = más caluroso que el promedio
