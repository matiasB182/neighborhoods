# ═══════════════════════════════════════════════════════════════════════════════
# SIMULADOR DE ESCENARIOS McDONALD'S PARAGUAY
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cómo usar este archivo:
#   1. Escribir un nombre descriptivo para el escenario
#   2. Buscar la palanca que corresponde a la simulación deseada (1 a 7)
#   3. Cambiar "activo: false" a "activo: true" en esa palanca
#   4. Completar los parámetros (ver instrucciones en cada sección)
#   5. Ejecutar: python run.py --scenario scenario.yaml
#
# IMPORTANTE: Solo una palanca puede estar activa a la vez.
#
# CÓMO FUNCIONA EL SISTEMA:
#   - Toma el forecast de ventas del período indicado como punto de partida.
#   - Cada palanca aplica un efecto sobre ese forecast según su lógica.
#   - El resultado muestra: unidades base, unidades simuladas y el delta %.
#   - Los efectos se calculan desde datos históricos reales cuando están
#     disponibles, o con supuestos documentados cuando no los hay.
#
# ═══════════════════════════════════════════════════════════════════════════════

escenario:
  nombre: "Nombre descriptivo del escenario"  # aparece en el output y en el CSV


palancas:

  # ════════════════════════════════════════════════════════════════════════════
  # 1) PRECIO — SIMULAR CAMBIO
  #
  # ¿Qué pasa si subo o bajo el precio de una categoría en un % fijo?
  #
  # CÓMO SE CALCULA:
  #   1. Busca la elasticidad histórica de la categoría:
  #      elasticidad = Δ% unidades / Δ% precio  (promedio de cambios históricos)
  #      Ej: elasticidad -0.8 → si el precio sube 10%, las ventas caen 8%
  #   2. impacto_volumen = cambio_pct × elasticidad
  #   3. unidades_simuladas = forecast × (1 + impacto_volumen)
  #   4. ingreso_simulado  = unidades_simuladas × precio_nuevo
  #
  # Parámetros:
  #   clasificacion_2 → texto libre, el sistema busca la categoría más parecida
  #   sucursal        → número de sucursal, o null para todas
  #   periodo_desde   → mes de inicio (YYYY-MM)
  #   periodo_hasta   → mes de fin    (YYYY-MM)
  #   cambio_pct      → positivo = sube precio | negativo = baja precio
  #
  # Ejemplos:
  #   "¿Qué pasa si subo 10% el Combo Big Mac?"  → cambio_pct: 0.10
  #   "¿Qué pasa si bajo 15% el McFlurry?"       → cambio_pct: -0.15
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: simular
    clasificacion_2: "combo big mac"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    cambio_pct: 0.10


  # ════════════════════════════════════════════════════════════════════════════
  # 2) PRECIO — OPTIMIZAR
  #
  # ¿Cuál es el precio óptimo para maximizar ingresos, unidades o llegar al
  # punto de equilibrio?
  #
  # CÓMO SE CALCULA:
  #   Evalúa cada cambio de precio en pasos de 1% dentro del rango definido
  #   y elige el que mejor cumple el objetivo indicado.
  #
  # Parámetros:
  #   clasificacion_2 → texto libre, el sistema busca la categoría más parecida
  #   sucursal        → número de sucursal, o null para todas
  #   periodo_desde   → mes de inicio (YYYY-MM)
  #   periodo_hasta   → mes de fin    (YYYY-MM)
  #   objetivo        → max_ingreso  = ¿a qué precio se maximiza el ingreso?
  #                     max_unidades = ¿a qué precio se venden más unidades?
  #                     breakeven    = ¿hasta cuánto puedo subir sin perder ingreso?
  #   rango_desde     → límite inferior del rango a explorar (ej: -0.30 = -30%)
  #   rango_hasta     → límite superior del rango a explorar (ej: +0.30 = +30%)
  #
  # Ejemplos:
  #   "¿A qué precio maximizo el ingreso del Combo Big Mac?"
  #   "¿Cuánto puedo subir el McFlurry sin perder plata?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: optimizar
    clasificacion_2: "combo big mac"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    objetivo: max_ingreso
    rango_desde: -0.30
    rango_hasta: 0.30


  # ════════════════════════════════════════════════════════════════════════════
  # 3) PROMOCIÓN
  #
  # ¿Qué impacto tendría una promoción sobre una categoría?
  # Cambiar el subtipo según el tipo de promo:
  #
  #   subtipo: descuento      → % de descuento sobre el precio
  #   subtipo: 2x1            → llevás 2 pagás 1 (equivale a 50% OFF)
  #   subtipo: precio_fijo    → precio especial en guaraníes
  #   subtipo: producto_gratis → regalo al comprar otro producto
  #
  # CÓMO SE CALCULA (todos los subtipos):
  #   1. forecast_promo = forecast_mensual / días_del_mes × días_de_la_promo
  #      (el forecast se escala a los días exactos que dura la promo)
  #   2. Se calcula el impacto sobre ese forecast_promo según el subtipo:
  #
  #   descuento / 2x1 / precio_fijo:
  #     cambio_pct efectivo = descuento aplicado (2x1 = -50% automático)
  #     impacto_volumen = cambio_pct × elasticidad_histórica
  #     unidades_simuladas = forecast_promo × (1 + impacto_volumen)
  #
  #   producto_gratis:
  #     uplift = medido sobre promos históricas similares con fechas disponibles
  #              (ventas_reales_promo - forecast_ese_período) / forecast_ese_período
  #     Si no hay fechas cargadas → uplift = +10% supuesto conservador
  #     unidades_simuladas = forecast_promo × (1 + uplift)
  #
  # Parámetros comunes:
  #   clasificacion_2 → texto libre, el sistema busca la categoría más parecida
  #   sucursal        → número de sucursal, o null para todas
  #   fecha_desde     → inicio de la promo (YYYY-MM-DD)
  #   fecha_hasta     → fin de la promo    (YYYY-MM-DD) — mismo día = promo de 1 día
  #   canal           → automac | delivery | app | restaurante | null = todos
  #
  # ════════════════════════════════════════════════════════════════════════════

  # — subtipo: descuento ——————————————————————————————————————————————————————
  # Ejemplos:
  #   "McDelivery Week: 30% OFF Combo Big Mac por Delivery"
  #   "Automac Days: 25% OFF Combo Cuarto de Libra"
  # ———————————————————————————————————————————————————————————————————————————
  - tipo: promocion
    activo: false
    subtipo: descuento
    clasificacion_2: "combo big mac"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-15"
    cambio_pct: -0.30              # -0.30 = 30% de descuento
    canal: null

  # — subtipo: 2x1 ————————————————————————————————————————————————————————————
  # Ejemplos:
  #   "2x1 McFlurry Oreo todos los viernes por Automac"
  #   "Día de la hamburguesa: 2x1 McCombo Cuarto de Libra"
  # ———————————————————————————————————————————————————————————————————————————
  - tipo: promocion
    activo: false
    subtipo: 2x1
    clasificacion_2: "mcflurry oreo"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-15"
    canal: null

  # — subtipo: precio_fijo ————————————————————————————————————————————————————
  # El sistema convierte el precio fijo a cambio_pct comparando con el precio
  # promedio histórico de la categoría, y luego aplica la elasticidad.
  #
  # Ejemplos:
  #   "Triple con Queso a Gs. 15.000 en restaurantes y Automac"
  #   "Combo Cuarto de Libra a Gs. 20.000"
  # ———————————————————————————————————————————————————————————————————————————
  - tipo: promocion
    activo: false
    subtipo: precio_fijo
    clasificacion_2: "triple con queso"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-15"
    precio: 15000                  # precio promocional en guaraníes
    canal: null

  # — subtipo: producto_gratis ————————————————————————————————————————————————
  # Ejemplos:
  #   "McNuggets gratis comprando un McCombo Cuarto de Libra"
  #   "Comprando 1 McCombo por PeYa te llevás 4 McNuggets de regalo"
  #   "Día de la Papa Frita: 1 McPapas mediana gratis por la App"
  # ———————————————————————————————————————————————————————————————————————————
  - tipo: promocion
    activo: false
    subtipo: producto_gratis
    clasificacion_2: "combo cuarto de libra"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-15"
    producto_gratis: "nuggets"     # nombre del regalo (solo descriptivo)
    canal: null


  # ════════════════════════════════════════════════════════════════════════════
  # 4) LANZAMIENTO
  #
  # ¿Qué impacto tendría lanzar un producto nuevo en una categoría?
  #
  # CÓMO SE CALCULA:
  #   1. Busca lanzamientos históricos de la misma categoría (o el proxy indicado)
  #   2. Para cada lanzamiento histórico calcula el uplift mes a mes:
  #      uplift_mes_n = (ventas_mes_n - promedio_histórico) / promedio_histórico
  #   3. Promedia el patrón entre todos los lanzamientos de referencia
  #   4. unidades_simuladas[mes] = forecast[mes] × (1 + uplift[mes_relativo])
  #      mes_relativo 0 = mes del lanzamiento, 1 = siguiente mes, etc.
  #   Si no hay lanzamientos de la misma categoría, usa el patrón promedio
  #   del mismo tipo de producto (postres, combos, etc.) o el default conservador:
  #   mes 0: +18% | mes 1: +12% | mes 2: +7% | mes 3: +4% | mes 4: +2% | mes 5: +1%
  #
  # Parámetros:
  #   clasificacion_2    → categoría donde se lanza el producto (texto libre)
  #   sucursal           → número de sucursal, o null para todas
  #   periodo_desde      → mes del lanzamiento (YYYY-MM)
  #   periodo_hasta      → dejar al menos 6 meses para ver el patrón completo
  #   nombre_referencia  → nombre descriptivo del producto nuevo (solo para el output)
  #   proxy_lanzamiento  → nombre de un lanzamiento histórico similar como referencia
  #                        null = el sistema elige automáticamente
  #
  # Ejemplos:
  #   "¿Qué impacto tendría lanzar un McFlurry nuevo sabor brownie?"
  #   "¿Cómo afectaría agregar un nuevo Combo al menú?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: lanzamiento
    activo: false
    clasificacion_2: "mcflurry"
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-09"
    nombre_referencia: "McFlurry Brownie nuevo"
    proxy_lanzamiento: "McFlurry Braunitos Tatakua"


  # ════════════════════════════════════════════════════════════════════════════
  # 5) ESTRUCTURAL
  #
  # ¿Qué impacto tendría agregar un canal de venta a una o varias sucursales?
  #
  # CÓMO SE CALCULA:
  #   1. Identifica sucursales que YA tienen el canal (grupo con canal)
  #   2. Identifica sucursales SIN el canal (grupo sin canal)
  #   3. Si se especifica zona, restringe a sucursales del mismo barrio/distrito/dpto
  #      para comparar sucursales más similares entre sí
  #   4. efecto = (ventas_promedio_con_canal − ventas_promedio_sin_canal)
  #               / ventas_promedio_sin_canal
  #   5. unidades_simuladas = forecast × (1 + efecto)
  #
  #   Nota: comparación observacional, no experimental. Sucursales con Automac
  #   pueden tener más ventas también por su ubicación. La zona reduce ese sesgo.
  #
  # Parámetros:
  #   canal     → automac | delivery | app | restaurante | centro_postres
  #   sucursal  → número de sucursal, o null para todas
  #   zona      → barrio | distrito | dpto | null = todo el país
  #
  # Ejemplos:
  #   "¿Cuánto aumentarían las ventas si la sucursal 1234 tuviera Automac?"
  #   "¿Qué impacto tendría habilitar Delivery en todas las sucursales?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: estructural
    activo: false
    clasificacion_2: null
    sucursal: null
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    canal: automac
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 6) COMPETENCIA
  #
  # ¿Qué impacto tendría que un competidor abra cerca de una sucursal?
  #
  # CÓMO SE CALCULA:
  #   1. Busca sucursales que ya tienen competidores a distancia similar (±0.3km)
  #   2. Si se especifica zona, restringe a sucursales del mismo barrio/distrito/dpto
  #   3. efecto = (ventas_con_competidor − ventas_sin_competidor)
  #               / ventas_sin_competidor  [siempre negativo o cero]
  #   4. unidades_simuladas[sucursal_afectada] = forecast × (1 + efecto)
  #
  #   Si no hay sucursales comparables, usa supuestos por banda de distancia:
  #     < 300m → -15%  |  300-600m → -10%  |  600m-1km → -6%
  #     1-2km  → -3%   |  > 2km    → -1%
  #
  # Parámetros:
  #   sucursal     → número de la sucursal afectada (obligatorio)
  #   distancia_km → distancia estimada del competidor en kilómetros
  #   zona         → barrio | distrito | dpto | null = todo el país
  #
  # Ejemplos:
  #   "¿Qué pasaría si Burger King abre a 500m de la sucursal 1234?"
  #   "¿Cuánto afectaría un competidor a 1km de la sucursal 5678?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: competencia
    activo: false
    clasificacion_2: null
    sucursal: 1234
    periodo_desde: "2025-04"
    periodo_hasta: "2025-06"
    distancia_km: 0.5
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 7) CLIMA
  #
  # ¿Qué impacto tendría un clima inusualmente frío, caluroso o lluvioso?
  #
  # CÓMO SE CALCULA:
  #   1. Cada categoría tiene un coeficiente de sensibilidad climática:
  #        postres/helados:        muy sensibles al frío  (coef. ~ -0.35 a -0.40)
  #        combos/hamburguesas:    poco sensibles         (coef. ~ -0.05)
  #        café/bebidas calientes: suben con el frío      (coef. ~ +0.20)
  #   2. efecto = variacion_pct × coeficiente_clima[categoría]
  #   3. unidades_simuladas = forecast × (1 + efecto)
  #
  #   variacion_pct es el desvío respecto al promedio histórico del período.
  #   Ej: -0.20 = ese mes fue 20% más frío/lluvioso que el promedio histórico.
  #
  #   Nota: los coeficientes son supuestos de industria, no calculados sobre
  #   datos de McDonald's Paraguay. Usarlo como referencia indicativa.
  #
  # Parámetros:
  #   variacion_pct → negativo = más frío/lluvioso | positivo = más caluroso
  #   sucursal      → número de sucursal, o null para todas
  #
  # Ejemplos:
  #   "¿Qué pasaría si junio es 20% más frío que el promedio histórico?"
  #   "¿Cómo afecta un verano 15% más caluroso a las ventas de McFlurry?"
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: clima
    activo: false
    clasificacion_2: null
    sucursal: null
    periodo_desde: "2025-06"
    periodo_hasta: "2025-08"
    variacion_pct: -0.20
