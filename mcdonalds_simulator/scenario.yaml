# ═══════════════════════════════════════════════════════════════════════════════
# SIMULADOR DE ESCENARIOS McDONALD'S PARAGUAY
# ═══════════════════════════════════════════════════════════════════════════════
#
# Cómo usar este archivo:
#   1. Escribir un nombre descriptivo para el escenario (aparece en el output)
#   2. Buscar la palanca que corresponde a la simulación deseada (1 a 7)
#   3. Cambiar "activo: false" a "activo: true" en esa palanca
#   4. Completar los parámetros de esa palanca
#   5. Ejecutar: python run.py --scenario scenario.yaml
#
# REGLA IMPORTANTE: Solo una palanca puede tener "activo: true" a la vez.
#   Si activás más de una, el sistema usa la primera que encuentre y las ignora.
#
# FECHAS:
#   Todas las palancas usan fecha_desde y fecha_hasta en formato YYYY-MM-DD.
#   Si el análisis es de varios meses, poner el primer y último día del rango.
#   Ejemplos:
#     Todo junio 2025:         fecha_desde: "2025-06-01"  fecha_hasta: "2025-06-30"
#     Abril a junio 2025:      fecha_desde: "2025-04-01"  fecha_hasta: "2025-06-30"
#     Un solo día:             fecha_desde: "2025-06-15"  fecha_hasta: "2025-06-15"
#
# GLOSARIO DE TÉRMINOS QUE APARECEN EN EL OUTPUT:
#   Forecast          = estimación de ventas esperadas sin ningún cambio
#   Unidades base     = cuántas unidades se esperaban vender (el forecast)
#   Unidades simul.   = cuántas unidades se estiman vender CON el cambio simulado
#   Delta unidades    = diferencia entre simul. y base (positivo = sube, negativo = baja)
#   Delta %           = esa diferencia expresada en porcentaje
#   Ingreso base      = Gs. esperados sin cambio (unidades base × precio actual)
#   Ingreso simul.    = Gs. estimados CON el cambio (unidades simul. × precio nuevo)
#   Elasticidad       = sensibilidad de las ventas al precio (ver palanca 1)
#   Uplift            = aumento porcentual de ventas generado por una promo o lanzamiento
#   Confianza         = qué tan respaldado está el número por datos históricos reales:
#                         alta    = muchos eventos históricos, número confiable
#                         media   = pocos eventos, tomarlo como referencia
#                         baja    = muy pocos eventos, orientativo
#                         supuesto = no hay datos, se usó un supuesto de industria
#
# CÓMO FUNCIONA EL SISTEMA:
#   El sistema parte del forecast de ventas del período indicado.
#   Cada palanca aplica una fórmula sobre ese forecast para estimar qué pasaría.
#   Cuando hay datos históricos reales los usa; cuando no, usa supuestos documentados.
#
# ═══════════════════════════════════════════════════════════════════════════════

escenario:
  nombre: "Nombre descriptivo del escenario"


palancas:

  # ════════════════════════════════════════════════════════════════════════════
  # 1) PRECIO — SIMULAR CAMBIO
  #
  # Pregunta: ¿Qué pasa con las ventas y los ingresos si subo o bajo el precio?
  #
  # Concepto clave — elasticidad:
  #   La elasticidad mide qué tan sensible es la demanda al precio.
  #   Se calcula a partir de los cambios de precio históricos de McDonald's:
  #   cada vez que el precio subió X%, ¿cuánto cayeron las ventas?
  #
  #   elasticidad = (cambio % en ventas) / (cambio % en precio)
  #
  #   Ejemplo: si cuando el precio subió 10%, las ventas cayeron 8%
  #            → elasticidad = -8% / 10% = -0.80
  #
  #   Una elasticidad de -0.80 significa:
  #   "por cada 1% que sube el precio, las ventas caen 0.80%"
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — calcular impacto en volumen:
  #     impacto_volumen = cambio_pct × elasticidad
  #     Ejemplo: +10% precio × -0.80 elasticidad = -8% en ventas
  #
  #   Paso 2 — calcular unidades simuladas:
  #     unidades_sim = forecast × (1 + impacto_volumen)
  #     Ejemplo: 10.000 unidades × (1 - 0.08) = 9.200 unidades
  #
  #   Paso 3 — calcular ingresos:
  #     precio_nuevo     = precio_actual × (1 + cambio_pct)
  #     ingreso_base     = forecast × precio_actual
  #     ingreso_sim      = unidades_sim × precio_nuevo
  #     Ejemplo: precio base Gs. 35.000 → precio nuevo Gs. 38.500
  #              ingreso base: 10.000 × 35.000 = Gs. 350.000.000
  #              ingreso sim:   9.200 × 38.500 = Gs. 354.200.000 (+1.2%)
  #              → ¡Se venden menos unidades pero se gana más plata!
  #
  # Parámetros:
  #   clasificacion_2 → categoría de producto (texto libre, el sistema busca la más parecida)
  #   sucursal        → número de sucursal, o null para todas las sucursales
  #   fecha_desde     → primer día del período a analizar (YYYY-MM-DD)
  #   fecha_hasta     → último día del período a analizar (YYYY-MM-DD)
  #   cambio_pct      → 0.10 = suba del 10% | -0.15 = baja del 15%
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: simular
    clasificacion_2: "combo big mac"
    sucursal: null
    fecha_desde: "2025-04-01"
    fecha_hasta: "2025-06-30"
    cambio_pct: 0.10


  # ════════════════════════════════════════════════════════════════════════════
  # 2) PRECIO — OPTIMIZAR
  #
  # Pregunta: ¿Cuál es el mejor precio para este producto?
  #
  # En vez de simular un cambio fijo, el sistema prueba todos los precios posibles
  # dentro del rango definido (en pasos de 1%) y devuelve el óptimo según el objetivo.
  #
  # FÓRMULA PASO A PASO:
  #   Para cada cambio de precio posible entre rango_desde y rango_hasta:
  #     unidades_sim = forecast × (1 + cambio_pct × elasticidad)
  #     ingreso_sim  = unidades_sim × precio_actual × (1 + cambio_pct)
  #   Se elige el cambio_pct que mejor cumple el objetivo indicado.
  #
  #   Ejemplo con elasticidad -0.80 y objetivo max_ingreso:
  #     cambio -30% → unidades +24%  → ingreso -12%  ← peor
  #     cambio   0% → unidades   0%  → ingreso   0%
  #     cambio +10% → unidades  -8%  → ingreso  +1%  ← mejor
  #     cambio +20% → unidades -16%  → ingreso   0%
  #     cambio +30% → unidades -24%  → ingreso  -7%  ← peor
  #     → el óptimo está en torno a +10% (depende de la elasticidad real)
  #
  # Parámetros:
  #   objetivo    → max_ingreso  = encontrar el precio que genera más Gs. en total
  #                 max_unidades = encontrar el precio que genera más ventas en unidades
  #                 breakeven    = hasta dónde puedo subir el precio sin perder Gs.
  #   rango_desde → precio mínimo a explorar, ej: -0.30 significa hasta -30%
  #   rango_hasta → precio máximo a explorar, ej: +0.30 significa hasta +30%
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: precio
    activo: false
    modo: optimizar
    clasificacion_2: "combo big mac"
    sucursal: null
    fecha_desde: "2025-04-01"
    fecha_hasta: "2025-06-30"
    objetivo: max_ingreso
    rango_desde: -0.30
    rango_hasta: 0.30


  # ════════════════════════════════════════════════════════════════════════════
  # 3) PROMOCIÓN
  #
  # Pregunta: ¿Cuánto impacto tiene una promoción puntual?
  #
  # Concepto clave — forecast_promo (base de la promo):
  #   Las promos duran días, no meses. No tiene sentido comparar una promo de
  #   3 días contra el forecast de todo el mes. Por eso el sistema escala el
  #   forecast mensual a los días exactos que dura la promo:
  #
  #   forecast_promo = forecast_mensual ÷ días_del_mes × días_de_la_promo
  #
  #   Ejemplo: forecast junio Combo Big Mac = 10.000 unidades (30 días)
  #            promo dura del 15 al 17 de junio = 3 días
  #            → forecast_promo = 10.000 ÷ 30 × 3 = 1.000 unidades base
  #
  #   El efecto se aplica sobre ese 1.000, no sobre el 10.000.
  #   El output muestra "unidades base/promo (3d)" para que quede claro.
  #
  # Subpalancas: 3.1) descuento  3.2) 2x1  3.3) precio_fijo  3.4) producto_gratis
  #
  # Parámetros comunes a todas las promos:
  #   clasificacion_2 → categoría de producto (texto libre)
  #   sucursal        → número de sucursal, o null para todas
  #   fecha_desde     → primer día de la promo (YYYY-MM-DD)
  #   fecha_hasta     → último día de la promo (YYYY-MM-DD) — mismo día = promo de 1 día
  #   canal           → automac | delivery | app | restaurante | null = todos los canales
  # ════════════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────────
  # 3.1) DESCUENTO
  #
  # Pregunta: ¿Cuánto sube el volumen si hago un X% de descuento?
  #
  # Usa la misma elasticidad que la palanca de precio pero sobre el forecast_promo.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — escalar forecast a los días de la promo:
  #     forecast_promo = forecast_mensual ÷ días_del_mes × días_de_la_promo
  #
  #   Paso 2 — calcular impacto en volumen:
  #     impacto_volumen = cambio_pct × elasticidad
  #     Ejemplo: -30% descuento × -0.80 elasticidad = +24% en ventas
  #
  #   Paso 3 — calcular unidades simuladas:
  #     unidades_sim = forecast_promo × (1 + impacto_volumen)
  #     Ejemplo: 1.000 × 1.24 = 1.240 unidades durante los 3 días de promo
  #
  #   Paso 4 — calcular ingresos:
  #     ingreso_base = forecast_promo × precio_actual
  #     ingreso_sim  = unidades_sim × precio_con_descuento
  #     Ejemplo: precio base Gs. 35.000 → precio promo Gs. 24.500
  #              ingreso base: 1.000 × 35.000 = Gs. 35.000.000
  #              ingreso sim:  1.240 × 24.500 = Gs. 30.380.000 (-13%)
  #              → Se venden más unidades pero se gana menos (el descuento es grande)
  #
  # Parámetro específico:
  #   cambio_pct → -0.30 = 30% de descuento | -0.50 = 50% de descuento
  #
  # Ejemplos de uso:
  #   "McDelivery Week: 30% OFF Combo Big Mac"
  #   "Automac Days: 25% OFF Combo Cuarto de Libra"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: descuento
    clasificacion_2: "combo big mac"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-17"
    cambio_pct: -0.30
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.2) 2x1
  #
  # Pregunta: ¿Cuántas unidades extra genera un 2x1?
  #
  # A diferencia del descuento (que aplica una fórmula de elasticidad), el 2x1
  # busca campañas 2x1 históricas reales del mismo tipo de producto y mide
  # qué uplift generaron en ventas comparado con el forecast de esos días.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — escalar forecast a los días de la promo:
  #     forecast_promo = forecast_mensual ÷ días_del_mes × días_de_la_promo
  #
  #   Paso 2 — calcular uplift desde datos históricos:
  #     Para cada campaña 2x1 histórica similar:
  #       uplift = (ventas_reales_durante_promo - forecast_esos_días) ÷ forecast_esos_días
  #     uplift_final = promedio de todos esos uplift
  #
  #   Paso 3 — calcular unidades simuladas:
  #     unidades_sim = forecast_promo × (1 + uplift_final)
  #     Ejemplo: forecast_promo 200 unidades, uplift histórico +45%
  #              → unidades_sim = 200 × 1.45 = 290 unidades
  #
  #   Si no hay campañas históricas con fechas cargadas:
  #     uplift = +40% (supuesto conservador, se indica en el output)
  #
  # Nota: el 2x1 no usa elasticidad porque el efecto psicológico de "llevás 2"
  #   es distinto a un simple descuento de precio y los datos históricos lo capturan mejor.
  #
  # Ejemplos de uso:
  #   "2x1 McFlurry Oreo todos los viernes por Automac"
  #   "Día de la hamburguesa: 2x1 McCombo Cuarto de Libra"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: 2x1
    clasificacion_2: "mcflurry oreo"
    sucursal: null
    fecha_desde: "2025-06-20"
    fecha_hasta: "2025-06-20"
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.3) PRECIO FIJO
  #
  # Pregunta: ¿Qué pasa si pongo un precio especial en guaraníes?
  #
  # Igual que el descuento, pero en vez de indicar el % de baja, se indica
  # directamente el precio en Gs. El sistema calcula solo el % de cambio.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — calcular el % de cambio respecto al precio histórico:
  #     cambio_pct = (precio_fijo - precio_promedio_histórico) ÷ precio_promedio_histórico
  #     Ejemplo: precio histórico Gs. 22.000, precio promo Gs. 15.000
  #              → cambio_pct = (15.000 - 22.000) ÷ 22.000 = -31.8%
  #
  #   Paso 2 en adelante — igual que descuento:
  #     impacto_volumen = -31.8% × elasticidad
  #     unidades_sim    = forecast_promo × (1 + impacto_volumen)
  #     ingreso_sim     = unidades_sim × Gs. 15.000
  #
  #   Ejemplo completo:
  #     forecast_promo Triple con Queso (3 días) = 900 unidades
  #     elasticidad = -0.80
  #     cambio_pct  = -31.8% → impacto_volumen = +25.4%
  #     → unidades_sim = 900 × 1.254 = 1.129 unidades
  #     → ingreso_sim  = 1.129 × 15.000 = Gs. 16.935.000
  #     vs ingreso_base = 900 × 22.000  = Gs. 19.800.000 (-14.5%)
  #
  # Parámetro específico:
  #   precio → precio promocional en guaraníes (ej: 15000)
  #
  # Ejemplos de uso:
  #   "Triple con Queso a Gs. 15.000 en restaurantes y Automac"
  #   "Combo Cuarto de Libra a Gs. 20.000 por la App"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: precio_fijo
    clasificacion_2: "triple con queso"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-17"
    precio: 15000
    canal: null


  # ────────────────────────────────────────────────────────────────────────────
  # 3.4) PRODUCTO GRATIS
  #
  # Pregunta: ¿Cuántas unidades extra genera regalar un producto al comprar otro?
  #
  # Aquí no hay cambio de precio, solo un incentivo de regalo. Por eso no se
  # usa elasticidad sino que se busca el uplift real de promos históricas similares.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — escalar forecast a los días de la promo:
  #     forecast_promo = forecast_mensual ÷ días_del_mes × días_de_la_promo
  #
  #   Paso 2 — calcular uplift desde campañas históricas similares:
  #     Para cada campaña "producto gratis" histórica del mismo tipo de producto:
  #       uplift = (ventas_reales_durante_promo - forecast_esos_días) ÷ forecast_esos_días
  #     uplift_final = promedio de todos esos uplift
  #
  #   Paso 3 — calcular unidades simuladas:
  #     unidades_sim = forecast_promo × (1 + uplift_final)
  #     Ejemplo: forecast_promo 600 unidades, uplift histórico +12%
  #              → unidades_sim = 600 × 1.12 = 672 unidades
  #
  #   Si no hay campañas históricas con fechas cargadas:
  #     uplift = +10% (supuesto conservador, se indica en el output)
  #     Para habilitar el cálculo real: cargar fechas en col D y E de la hoja
  #     "Códigos-Promo" del Excel de promos y volver a correr el ETL.
  #
  # Parámetro específico:
  #   producto_gratis → nombre del producto que se regala (solo descriptivo, no afecta el cálculo)
  #
  # Ejemplos de uso:
  #   "McNuggets gratis comprando un McCombo Cuarto de Libra"
  #   "Comprando 1 McCombo por PeYa te llevás 4 McNuggets de regalo"
  #   "Día de la Papa Frita: 1 McPapas mediana gratis por la App"
  # ────────────────────────────────────────────────────────────────────────────
  - tipo: promocion
    activo: false
    subtipo: producto_gratis
    clasificacion_2: "combo cuarto de libra"
    sucursal: null
    fecha_desde: "2025-06-15"
    fecha_hasta: "2025-06-16"
    producto_gratis: "nuggets"
    canal: null


  # ════════════════════════════════════════════════════════════════════════════
  # 4) LANZAMIENTO
  #
  # Pregunta: ¿Cuánto impacto tendría lanzar un producto nuevo al mercado?
  #
  # Concepto clave — patrón de lanzamiento:
  #   Cuando se lanza un producto nuevo, hay un "pico" de ventas inicial (novedad,
  #   publicidad, curiosidad) que luego decae gradualmente hasta el nivel base.
  #   El sistema mide ese patrón de lanzamientos históricos y lo aplica al forecast.
  #
  #   Patrón default conservador (si no hay historial):
  #     mes 0 (mes del lanzamiento): +18%
  #     mes 1:                       +12%
  #     mes 2:                        +7%
  #     mes 3:                        +4%
  #     mes 4:                        +2%
  #     mes 5 en adelante:            +1%  (decae casi a la base)
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — buscar lanzamientos históricos de referencia:
  #     - Si hay proxy_lanzamiento → usa ese lanzamiento específico como referencia
  #     - Si no → promedia el patrón de todos los lanzamientos de la misma categoría
  #     - Si tampoco → usa el patrón default de arriba
  #
  #   Paso 2 — calcular el patrón de uplift por mes:
  #     Para cada lanzamiento histórico de referencia:
  #       baseline     = promedio de ventas mensuales de la categoría antes del lanzamiento
  #       uplift_mes_n = (ventas_mes_n - baseline) ÷ baseline
  #     uplift_final por mes = promedio de todos los lanzamientos históricos
  #
  #   Paso 3 — aplicar el patrón al forecast:
  #     unidades_sim[mes] = forecast[mes] × (1 + uplift[mes_relativo])
  #     donde mes_relativo 0 = mes del lanzamiento, 1 = mes siguiente, etc.
  #
  #   Ejemplo:
  #     forecast McFlurry mayo = 5.000 unidades (mes del lanzamiento)
  #     uplift mes 0 histórico = +18%
  #     → unidades_sim mayo = 5.000 × 1.18 = 5.900 unidades
  #     forecast McFlurry junio = 5.200 unidades
  #     uplift mes 1 = +12%
  #     → unidades_sim junio = 5.200 × 1.12 = 5.824 unidades
  #
  # Parámetros:
  #   clasificacion_2    → categoría donde se lanza el producto (texto libre)
  #   sucursal           → número de sucursal, o null para todas
  #   fecha_desde        → primer día del mes de lanzamiento (YYYY-MM-DD)
  #   fecha_hasta        → último día del período a analizar (mínimo 6 meses)
  #   nombre_referencia  → nombre del producto nuevo (solo aparece en el output)
  #   proxy_lanzamiento  → nombre de un lanzamiento histórico similar para usar como referencia
  #                        null = el sistema elige automáticamente según la categoría
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: lanzamiento
    activo: false
    clasificacion_2: "mcflurry"
    sucursal: null
    fecha_desde: "2025-04-01"
    fecha_hasta: "2025-09-30"
    nombre_referencia: "McFlurry Brownie nuevo"
    proxy_lanzamiento: "McFlurry Braunitos Tatakua"


  # ════════════════════════════════════════════════════════════════════════════
  # 5) ESTRUCTURAL
  #
  # Pregunta: ¿Cuánto aumentarían las ventas si agrego un canal a una sucursal?
  #
  # Concepto clave — comparación entre sucursales:
  #   El sistema compara las ventas históricas de dos grupos de sucursales:
  #     - Grupo A: sucursales que YA tienen el canal (ej: ya tienen Automac)
  #     - Grupo B: sucursales que NO tienen el canal
  #   La diferencia porcentual entre ambos grupos es el efecto estimado.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — identificar los dos grupos:
  #     con_canal = sucursales que ya tienen el canal habilitado
  #     sin_canal = sucursales que no lo tienen
  #
  #   Paso 2 — calcular el efecto:
  #     avg_con = promedio de ventas históricas de las sucursales con el canal
  #     avg_sin = promedio de ventas históricas de las sucursales sin el canal
  #     efecto  = (avg_con - avg_sin) ÷ avg_sin
  #
  #   Paso 3 — aplicar al forecast:
  #     unidades_sim = forecast × (1 + efecto)
  #
  #   Ejemplo:
  #     Sucursales CON Automac venden en promedio 12.000 unidades/mes de combos.
  #     Sucursales SIN Automac venden en promedio 9.000 unidades/mes de combos.
  #     → efecto = (12.000 - 9.000) ÷ 9.000 = +33%
  #     → forecast sucursal sin Automac = 8.500 unidades
  #     → unidades_sim = 8.500 × 1.33 = 11.305 unidades
  #
  # IMPORTANTE — limitación de este cálculo:
  #   Esta es una comparación observacional, no un experimento controlado.
  #   Las sucursales con Automac pueden tener más ventas también porque están
  #   en mejores ubicaciones, tienen más tráfico, etc. — no solo por el Automac.
  #   El parámetro "zona" ayuda a reducir ese sesgo comparando sucursales
  #   del mismo barrio, distrito o departamento (más similares entre sí).
  #
  # Parámetros:
  #   canal     → automac | delivery | app | restaurante | centro_postres
  #   sucursal  → número de sucursal específica, o null para todas
  #   zona      → barrio | distrito | dpto | null = comparar contra todo el país
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: estructural
    activo: false
    clasificacion_2: null
    sucursal: null
    fecha_desde: "2025-04-01"
    fecha_hasta: "2025-06-30"
    canal: automac
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 6) COMPETENCIA
  #
  # Pregunta: ¿Cuánto caerían las ventas de una sucursal si abre un competidor cerca?
  #
  # Concepto clave — sucursales comparables:
  #   El sistema busca sucursales de McDonald's que ya tienen un competidor
  #   a una distancia similar a la indicada, y compara sus ventas contra
  #   sucursales sin competidor cercano.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — encontrar sucursales comparables:
  #     similares = sucursales que ya tienen un competidor a distancia_km ± 0.3km
  #
  #   Paso 2 — calcular el efecto:
  #     avg_con_comp = promedio de ventas históricas de esas sucursales (con competidor)
  #     avg_sin_comp = promedio de ventas históricas de sucursales sin competidor cercano
  #     efecto       = (avg_con_comp - avg_sin_comp) ÷ avg_sin_comp  [siempre negativo]
  #
  #   Paso 3 — aplicar a la sucursal afectada:
  #     unidades_sim[sucursal_afectada] = forecast × (1 + efecto)
  #     unidades_sim[resto de sucursales] = forecast  (sin cambio)
  #
  #   Ejemplo:
  #     Sucursales con competidor a 400-600m venden 9.200 unidades/mes en promedio.
  #     Sucursales sin competidor venden 10.000 unidades/mes en promedio.
  #     → efecto = (9.200 - 10.000) ÷ 10.000 = -8%
  #     → forecast sucursal 1234 = 11.500 unidades
  #     → unidades_sim = 11.500 × 0.92 = 10.580 unidades (-920 unidades)
  #
  #   Si no hay suficientes sucursales comparables, se usan supuestos por distancia:
  #     < 300m    → -15%  (impacto muy fuerte, competidor en la misma cuadra)
  #     300-600m  → -10%  (impacto fuerte, a pocas cuadras)
  #     600m-1km  →  -6%  (impacto moderado)
  #     1-2km     →  -3%  (impacto leve)
  #     > 2km     →  -1%  (impacto mínimo, casi no se siente)
  #
  # Parámetros:
  #   sucursal     → número de la sucursal afectada (obligatorio, no aplica a todas)
  #   distancia_km → distancia estimada del competidor en kilómetros (ej: 0.5 = 500m)
  #   zona         → barrio | distrito | dpto | null = comparar contra todo el país
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: competencia
    activo: false
    clasificacion_2: null
    sucursal: 1234
    fecha_desde: "2025-04-01"
    fecha_hasta: "2025-06-30"
    distancia_km: 0.5
    zona: null


  # ════════════════════════════════════════════════════════════════════════════
  # 7) CLIMA
  #
  # Pregunta: ¿Cómo afectaría un mes más frío o más caluroso de lo normal a las ventas?
  #
  # Concepto clave — coeficiente de sensibilidad climática:
  #   No todas las categorías reaccionan igual al clima.
  #   Los helados y postres caen mucho con el frío (nadie quiere un McFlurry en invierno).
  #   El café sube un poco con el frío. Los combos apenas se mueven.
  #   Estos coeficientes están basados en comportamiento estacional típico de la industria.
  #
  # FÓRMULA PASO A PASO:
  #   Paso 1 — identificar el coeficiente de sensibilidad de la categoría:
  #     mcflurry / helados / sundae  → coef. -0.40  (muy sensibles al frío)
  #     mccafe / café               → coef. +0.20  (suben con el frío)
  #     combos / hamburguesas       → coef. -0.05  (casi no se mueven)
  #     papas                       → coef. -0.02  (prácticamente insensibles)
  #
  #   Paso 2 — calcular el efecto:
  #     efecto = variacion_pct × coeficiente_clima
  #
  #   Paso 3 — aplicar al forecast:
  #     unidades_sim = forecast × (1 + efecto)
  #
  #   Ejemplo — junio 20% más frío que el promedio histórico (variacion_pct: -0.20):
  #     McFlurry:  efecto = -0.20 × -0.40 = -0.08  → caen  8%
  #                forecast 3.000 → unidades_sim 2.760
  #     McCafé:    efecto = -0.20 × +0.20 = +0.04  → suben 4%
  #                forecast 1.000 → unidades_sim 1.040
  #     Combos:    efecto = -0.20 × -0.05 = -0.01  → caen  1%  (casi nada)
  #
  # RESUMEN RÁPIDO:
  #   variacion_pct < 0 (más frío/lluvioso que el promedio):
  #     → McFlurry y postres BAJAN | McCafé SUBE | combos casi igual
  #   variacion_pct > 0 (más caluroso que el promedio):
  #     → McFlurry y postres SUBEN | McCafé BAJA | combos casi igual
  #
  # Nota: los coeficientes son supuestos de industria, no calculados sobre datos
  #   históricos de McDonald's Paraguay. El resultado es indicativo, no exacto.
  #
  # Parámetros:
  #   variacion_pct → -0.20 = 20% más frío/lluvioso | +0.20 = 20% más caluroso
  #                   que el promedio histórico del período indicado
  #   sucursal      → número de sucursal, o null para todas
  # ════════════════════════════════════════════════════════════════════════════
  - tipo: clima
    activo: false
    clasificacion_2: null
    sucursal: null
    fecha_desde: "2025-06-01"
    fecha_hasta: "2025-08-31"
    variacion_pct: -0.20
